<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Trade</title>
<style>
:root{--bg:#fff;--fg:#222;--accent:#2e6ff2;--muted:#707579;--card:#f4f4f5}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);padding:16px}.card{background:var(--card);border-radius:14px;padding:16px;margin:10px 0}.row{display:flex;align-items:center;gap:10px}.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}h1{font-size:20px;margin:0 0 4px}.muted{color:var(--muted);font-size:13px}.hero{font-size:18px;font-weight:700}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--bg);margin:4px 4px 0 0;font-size:12px}button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;margin-top:10px}.hide{display:none}.err{color:#c62828}.field{width:100%;box-sizing:border-box;padding:12px;border:1px solid rgba(127,127,127,.35);border-radius:10px;font-size:15px;margin:6px 0;background:var(--bg);color:var(--fg)}.seg{display:flex;gap:8px;margin:6px 0}.segBtn{flex:1;margin:0;padding:11px;border:1px solid rgba(127,127,127,.35);background:var(--bg);color:var(--fg);border-radius:10px}.segBtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}.up{flex:1;text-align:center;padding:16px 8px;border:1.5px dashed rgba(127,127,127,.5);border-radius:12px;color:var(--muted);font-size:13px}.up.has{background:var(--card);border-color:var(--accent);color:var(--fg)}
</style>
</head>
<body>
<div class="row"><div class="avatar" id="avatar">?</div><div><h1 id="name">Trade</h1><div class="muted" id="sub">Telegram Mini App</div></div></div>
<div class="card" id="statusCard"><div class="muted" id="status">Signing in…</div><div id="err" class="hide err"></div></div>
<div class="card hide" id="contextCard"><div class="hero" id="welcome"></div><div class="muted" id="details"></div><div id="verification"></div></div>
<div class="card hide" id="resultsCard"><div class="hero" id="resultsHead"></div><div class="muted" id="resultsMeta"></div><div id="results"></div></div>
<div class="card hide" id="regCard">
 <div class="hero">Seller registration</div>
 <div class="muted" style="margin-bottom:10px">Set up your seller account to start listing on Trade.</div>
 <input id="regName" class="field" placeholder="Business name" autocomplete="off">
 <div class="seg" id="regType"><button type="button" class="segBtn on" data-type="product">🏷 Product</button><button type="button" class="segBtn" data-type="service">🛎 Service</button></div>
 <select id="regCountry" class="field"><option value="">Country…</option></select>
 <select id="regRegion" class="field" disabled><option value="">Region…</option></select>
 <select id="regCity" class="field" disabled><option value="">City…</option></select>
 <div class="row" style="margin-top:10px">
  <label class="up" id="upId">🪪 National ID<input type="file" id="fileId" accept="image/*" class="hide"></label>
  <label class="up" id="upLic">📜 Trade license<input type="file" id="fileLic" accept="image/*" class="hide"></label>
 </div>
 <div class="muted" id="regHint"></div>
 <button id="regSubmit" class="hide">Submit registration</button>
</div>
<button class="hide" id="continueBtn">Continue</button>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){
 var tg=window.Telegram&&window.Telegram.WebApp, REST=location.origin+'/wp-json/trade/v1/', token=null, ctx=null;
 function $(id){return document.getElementById(id)} function show(id){$(id).classList.remove('hide')}
 function status(t){$('status').textContent=t} function fail(t){$('err').textContent=t;show('err');status('Could not open Trade')}
 if(!tg){fail('Please open Trade from Telegram.');return}
 tg.ready();tg.expand();
 document.documentElement.style.setProperty('--bg',tg.themeParams.bg_color||'#fff');document.documentElement.style.setProperty('--fg',tg.themeParams.text_color||'#222');document.documentElement.style.setProperty('--accent',tg.themeParams.button_color||'#2e6ff2');document.documentElement.style.setProperty('--muted',tg.themeParams.hint_color||'#707579');document.documentElement.style.setProperty('--card',tg.themeParams.secondary_bg_color||'#f4f4f5');
 var user=tg.initDataUnsafe&&tg.initDataUnsafe.user;
 if(user){$('name').textContent=(user.first_name||'')+(user.last_name?' '+user.last_name:'');$('avatar').textContent=(user.first_name||'?').charAt(0);$('sub').textContent='@'+(user.username||('tg '+user.id))}
 var qp=new URLSearchParams(location.search), filters={category:(qp.get('category')||'').trim(),location:(qp.get('location')||'').trim(),budget_max:parseInt(qp.get('budget_max')||'0',10)||0};
 async function openApp(){
  try{
   var r=await fetch(REST+'mini_app/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData})});
   var j=await r.json(); if(!j.success){fail((j.error&&j.error.message)||'Login failed');return}
   token=j.data.session_token; ctx=j.data;
   if(qp.get('view')==='register'){await loadRegistration();return;}
   if(filters.category){await loadResults();}else{await loadContext();}
  }catch(e){fail('Network error. Please try again.');}
 }
 function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
 function caps(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1)}
 var reg={type:'product',country:null,region:null,city:null,idFile:null,licFile:null};
 async function api(path,opts){opts=opts||{};opts.headers=Object.assign({'Authorization':'Bearer '+token},opts.headers||{});var r=await fetch(REST+path,opts);return r.json();}
 async function loadRegistration(){
  try{
   status('Loading registration…');show('regCard');$('regSubmit').classList.remove('hide');
   var j=await api('locations');if(!j.success){fail((j.error&&j.error.message)||'Could not load locations.');return}
   var sel=$('regCountry');sel.innerHTML='<option value="">Country…</option>';
   for(var i=0;i<(j.data||[]).length;i++){var l=j.data[i],o=document.createElement('option');o.value=l.id;o.textContent=l.name;sel.appendChild(o);}
   status('Ready');
  }catch(e){fail('Could not load registration.');}
 }
 async function loadChildren(selId,parentId,placeholder){
  try{
   var sel=$(selId);sel.innerHTML='<option value="">'+placeholder+'</option>';sel.disabled=true;
   var j=await api('locations'+(parentId?('?parent_id='+parentId):''));
   if(j.success){for(var i=0;i<(j.data||[]).length;i++){var l=j.data[i],o=document.createElement('option');o.value=l.id;o.textContent=l.name;sel.appendChild(o);}}
   sel.disabled=false;
  }catch(e){$(selId).disabled=false;}
 }
 $('regCountry').addEventListener('change',function(){reg.country=this.value;reg.region=null;reg.city=null;$('regCity').innerHTML='<option value="">City…</option>';$('regCity').disabled=true;loadChildren('regRegion',this.value,'Region…');});
 $('regRegion').addEventListener('change',function(){reg.region=this.value;reg.city=null;loadChildren('regCity',this.value,'City…');});
 $('regCity').addEventListener('change',function(){reg.city=this.value;});
 Array.prototype.forEach.call(document.querySelectorAll('#regType .segBtn'),function(b){b.addEventListener('click',function(){Array.prototype.forEach.call(document.querySelectorAll('#regType .segBtn'),function(x){x.classList.remove('on')});b.classList.add('on');reg.type=b.getAttribute('data-type');});});
 $('fileId').addEventListener('change',function(){reg.idFile=this.files&&this.files[0]||null;$('upId').classList.toggle('has',!!reg.idFile);});
 $('fileLic').addEventListener('change',function(){reg.licFile=this.files&&this.files[0]||null;$('upLic').classList.toggle('has',!!reg.licFile);});
 $('regSubmit').addEventListener('click',async function(){
  var name=$('regName').value.trim(),locId=parseInt(reg.city||reg.region||reg.country,10)||0;
  if(!name){$('regHint').textContent='Enter your business name.';return}
  if(!locId){$('regHint').textContent='Pick your country, region, and city.';return}
  if(!reg.idFile||!reg.licFile){$('regHint').textContent='Add your national ID and trade-license photos.';return}
  try{
   status('Submitting registration…');
   var m=await api('merchants',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({business_name:name,merchant_type:reg.type,location_id:locId})});
   if(!m.success){fail((m.error&&m.error.message)||'Could not save your business.');return}
   ctx.merchant_id=m.data.id||0;
   await api('verification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({merchant_id:ctx.merchant_id})});
   var up=function(field,docType){var fd=new FormData();fd.append('merchant_id',ctx.merchant_id);fd.append('document_type',docType);fd.append('file',reg[field]);return api('verification/documents',{method:'POST',body:fd});};
   await up('idFile','national_id');await up('licFile','trade_license');
   status('Ready');
   $('regCard').innerHTML='<div class="hero">✅ Registration submitted</div><div class="muted">Your seller account is under admin review. You can add listings in the meantime.</div>';
   $('continueBtn').textContent='Open workspace';show('continueBtn');
  }catch(e){fail('Could not submit registration.');}
 });
 async function loadResults(){
  try{
   status('Searching '+filters.category+'…');
   var q=encodeURIComponent((filters.category+' '+(filters.location||'')).trim());
   var url=REST+'search?q='+q+(filters.budget_max?('&price_max='+filters.budget_max):'');
   var r=await fetch(url,{headers:{Authorization:'Bearer '+token}});var j=await r.json();
   if(!j.success){fail((j.error&&j.error.message)||'Search failed.');return}
   var items=(j.data||[]), meta=j.meta||{};
   $('resultsHead').textContent=caps(filters.category);
   var parts=[];
   if(filters.location)parts.push('in '+filters.location);
   if(filters.budget_max)parts.push('up to '+filters.budget_max+' ETB');
   $('resultsMeta').textContent=(parts.length?parts.join(' ')+' · ':'')+meta.total+' item'+(meta.total===1?'':'s');
   var html='';
   if(meta.total===0){html='<div class="muted">No matching items yet. The bot will tell you when something fits.</div>';}
   else{for(var i=0;i<items.length;i++){var it=items[i];html+='<div class="card"><div class="hero" style="font-size:15px">'+esc(it.product&&it.product.canonical_name||('Listing #'+it.id))+'</div><span class="pill">'+esc(it.price)+' '+esc(it.currency||'ETB')+'</span></div>';}}
   $('results').innerHTML=html;status('Ready');show('resultsCard');
  }catch(e){fail('Could not load search results.');}
 }
 async function loadContext(){
  try{
   var r=await fetch(REST+'mini_app/onboard',{headers:{Authorization:'Bearer '+token}});var j=await r.json();if(!j.success){fail('Could not load your workspace.');return}
   ctx=Object.assign({},ctx,j.data||{});status('Ready');show('contextCard');
   var role=ctx.role==='merchant'?'Merchant':'Customer'; $('welcome').textContent=role+' workspace';
   var screen=ctx.launch_screen||'customer_home'; $('details').textContent='Language: '+(ctx.language||'en')+' · '+screen.replaceAll('_',' ');
   if(ctx.role==='merchant'){
    var v=ctx.verification_status||'none';$('verification').innerHTML='<span class="pill">Verification: '+v+'</span>';
    if(v!=='verified'){$('verification').innerHTML+='<div class="muted" style="margin-top:10px">Merchant verification is required before publishing marketplace listings.</div>';}
   }
   $('continueBtn').textContent=screen==='merchant_verification'?'Start verification':'Open workspace';show('continueBtn');
  }catch(e){fail('Could not load your workspace.');}
 }
 async function openWorkspace(){
  try{
   status('Loading your workspace…');
   var url=REST+'listings';
   if(ctx.role==='merchant'&&ctx.merchant_id){url+='?merchant_id='+ctx.merchant_id+'&per_page=20';}
   else{url+='?per_page=8';}
   var r=await fetch(url,{headers:{Authorization:'Bearer '+token}});var j=await r.json();
   if(!j.success){fail((j.error&&j.error.message)||'Could not load the workspace.');return}
   var items=j.data||[];
   var heading=ctx.role==='merchant'?'Your listings':'Latest on Trade';
   var html='';
   if(!items.length){html='<div class="muted">No listings yet.'+(ctx.role==='merchant'?' Add one via the chat, then publish here.':' Check back soon.')+'</div>';}
   else{
    for(var i=0;i<items.length;i++){var it=items[i];
     html+='<div class="card"><div class="hero" style="font-size:15px">'+esc(it.product&&it.product.canonical_name||('Listing #'+it.id))+'</div>'
      +'<span class="pill">'+esc(it.price)+' '+esc(it.currency||'ETB')+'</span>'
      +(it.status?' <span class="pill">'+esc(it.status)+'</span>':'')+'</div>';
    }
   }
   $('resultsHead').textContent=heading; $('resultsMeta').textContent=items.length+' shown'; $('results').innerHTML=html;
   status('Ready'); show('resultsCard');
  }catch(e){fail('Could not open the workspace.');}
 }
 $('continueBtn').addEventListener('click',function(){ openWorkspace(); });
 openApp();
})();
</script>
</body>
</html>
